name: build test iso

on:
  workflow_dispatch:
    inputs:
      webui:
        description: "webui branch"
        required: true
        default: "master"
        type: string
      middleware:
        description: "middleware branch"
        required: true
        default: "master"
        type: string
      uploadIso:
        description: "upload iso to cos"
        required: true
        default: "true"
        type: string

jobs:
  build-iso:
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - name: set version
        id: set-version
        run: |
          _VERS="26.04.0-MASTER"
          VERSION="${_VERS}-$(date +%Y%m%d-%H%M%S)"
          # example, 26.04.0-MASTER-20251003-213627
          echo "HarborNAS_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
      - name: install packages
        run: |
          sudo apt install -y build-essential debootstrap git python3-pip python3-venv squashfs-tools unzip libjson-perl rsync libarchive-tools
      - name: update to latest sources
        run: |
          sudo truenas_webui_OVERRIDE=${{ inputs.webui }} truenas_OVERRIDE=${{ inputs.middleware }} make checkout
      - name: Builds all the *.deb packages
        run: |
          sudo TRUENAS_VERSION=${{steps.set-version.outputs.HarborNAS_VERSION}} make packages
      - name: Builds the stand-alone update file
        run: |
          sudo make update
      - name: Builds the ISO image
        run: |
          sudo TRUENAS_VENDOR=HarborOS make iso
      - name: upload iso
        if: ${{ inputs.uploadIso == 'true' }}
        env:
          QCLOUD_ACCESS_KEY_ID: ${{ secrets.QCLOUD_SECRETID }}
          QCLOUD_SECRET_ACCESS_KEY: ${{ secrets.QCLOUD_SECRETKEY }}
          TRUENAS_VERSION: ${{steps.set-version.outputs.HarborNAS_VERSION}}
        run: |
          isoFileName="TrueNAS-SCALE-${TRUENAS_VERSION}-HarborOS"
          updateFileName="TrueNAS-SCALE-${TRUENAS_VERSION}"
          CODE_NAME=$(yq -r '.code_name' conf/build.manifest)
          R2_ENDPOINT="https://b001991453068c59d8f4aa512bc0b16a.r2.cloudflarestorage.com"
          R2_BUCKET="harboros-update"
          coscli config add -b willow-1256175635 -r ap-guangzhou -a willow --init-skip || true
          coscli cp --secret-id $QCLOUD_ACCESS_KEY_ID --secret-key $QCLOUD_SECRET_ACCESS_KEY "./tmp/release/${isoFileName}.iso" "cos://willow/test/${isoFileName}.iso"
          coscli cp --secret-id $QCLOUD_ACCESS_KEY_ID --secret-key $QCLOUD_SECRET_ACCESS_KEY "./tmp/release/${isoFileName}.iso.sha256" "cos://willow/test/${isoFileName}.iso.sha256"
          /usr/local/bin/aws s3api put-object --endpoint-url ${R2_ENDPOINT} --bucket ${R2_BUCKET} --key "scale/TrueNAS-SCALE-${CODE_NAME}-Nightlies/${updateFileName}.update" --body "./tmp/release/${updateFileName}.update"
          /usr/local/bin/aws s3api put-object --endpoint-url ${R2_ENDPOINT} --bucket ${R2_BUCKET} --key "scale/TrueNAS-SCALE-${CODE_NAME}-Nightlies/${updateFileName}.update.sha256" --body "./tmp/release/${updateFileName}.update.sha256"
      - name: update releases.json
        if: ${{ inputs.uploadIso == 'true' }}
        env:
          TRUENAS_VERSION: ${{steps.set-version.outputs.HarborNAS_VERSION}}
        run: |
          updateFileName="TrueNAS-SCALE-${TRUENAS_VERSION}"
          CODE_NAME=$(yq -r '.code_name' conf/build.manifest)
          R2_ENDPOINT="https://b001991453068c59d8f4aa512bc0b16a.r2.cloudflarestorage.com"
          R2_BUCKET="harboros-update"
          RELEASES_KEY="scale/TrueNAS-SCALE-${CODE_NAME}-Nightlies/releases.json"

          mkdir -p ./tmp/update-releases

          echo "Downloading existing releases.json from R2..."
          /usr/local/bin/aws s3api get-object --endpoint-url ${R2_ENDPOINT} --bucket ${R2_BUCKET} --key "${RELEASES_KEY}" ./tmp/update-releases/releases.json || echo "{}" > ./tmp/update-releases/releases.json

          echo "Reading checksum from ./tmp/release/${updateFileName}.update.sha256..."
          CHECKSUM=$(cat "./tmp/release/${updateFileName}.update.sha256" | awk '{print $1}')

          echo "Getting file size..."
          FILESIZE=$(stat --format=%s "./tmp/release/${updateFileName}.update")

          echo "Generating current date..."
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.%6N")

          echo "Creating new release entry..."
          NEW_ENTRY=$(cat <<EOF
          {
            "${TRUENAS_VERSION}": {
              "filename": "${updateFileName}.update",
              "version": "${TRUENAS_VERSION}",
              "date": "${CURRENT_DATE}",
              "changelog": "",
              "checksum": "${CHECKSUM}",
              "filesize": ${FILESIZE},
              "profile": "DEVELOPER"
            }
          }
          EOF
          )

          echo "Merging with existing releases.json..."
          jq -s '.[0] * .[1]' ./tmp/update-releases/releases.json <(echo "${NEW_ENTRY}") > ./tmp/update-releases/releases_updated.json

          echo "Keeping only last 30 entries by date..."
          jq 'to_entries | sort_by(.value.date) | .[-30:] | from_entries' ./tmp/update-releases/releases_updated.json > ./tmp/update-releases/releases_final.json

          echo "Uploading updated releases.json to R2..."
          /usr/local/bin/aws s3api put-object --endpoint-url ${R2_ENDPOINT} --bucket ${R2_BUCKET} --key "${RELEASES_KEY}" --body ./tmp/update-releases/releases_final.json --content-type "application/json"

          echo "Successfully updated releases.json with version ${TRUENAS_VERSION}"

          echo "clean up"
          rm -rf ./tmp/update-releases
